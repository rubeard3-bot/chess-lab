<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Practice Board — Chess Lab</title>
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .hidden { display: none !important; }

    body.practice-page {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
    }

    .practice-container {
      max-width: 920px;
      margin: 0 auto;
      padding: 24px 24px 48px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* ── Header ─────────────────────────────────────── */
    .practice-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }
    .practice-header-center {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .practice-header-icon { font-size: 26px; color: var(--accent); line-height: 1; }
    .practice-title { font-size: 20px; font-weight: 800; color: var(--text); }
    .practice-header-spacer { width: 80px; flex-shrink: 0; }

    /* ── Piece palette ───────────────────────────────── */
    .palette-wrap {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .palette-label {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text2);
      white-space: nowrap;
    }
    .palette-pieces { display: flex; gap: 3px; }

    .pal-piece {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      border-radius: 5px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s;
      user-select: none;
      line-height: 1;
    }
    .pal-white { background: #e8d5b4; color: #1a1a1a; }
    .pal-black { background: #5c3f28; color: #e8d5b4; }
    .pal-piece:hover { border-color: rgba(255,255,255,0.35); }
    .pal-piece.selected { border-color: var(--accent); }

    .pal-sep { width: 1px; height: 28px; background: var(--border); flex-shrink: 0; }

    .pal-eraser-btn {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      border-radius: 5px;
      border: 2px solid transparent;
      background: var(--card);
      color: var(--text2);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      flex-shrink: 0;
    }
    .pal-eraser-btn:hover { border-color: var(--danger); color: var(--danger); }
    .pal-eraser-btn.selected {
      border-color: var(--danger);
      color: var(--danger);
      background: rgba(224,82,82,0.12);
    }

    .pal-done-btn {
      margin-left: auto;
      padding: 7px 16px;
      background: rgba(127,166,80,0.15);
      border: 1px solid rgba(127,166,80,0.35);
      color: var(--accent);
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      font-family: inherit;
      flex-shrink: 0;
    }
    .pal-done-btn:hover { background: rgba(127,166,80,0.25); border-color: var(--accent); }

    /* ── Main layout ─────────────────────────────────── */
    .practice-main {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }

    /* ── Promotion picker ────────────────────────────── */
    .promo-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.72);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      border-radius: 4px;
    }
    .promo-card {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 10px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .promo-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.07em;
    }
    .promo-options { display: flex; gap: 8px; }
    .promo-piece {
      width: 80px;
      height: 80px;
      border: 2px solid rgba(255,255,255,0.10);
      border-radius: 6px;
      cursor: pointer;
      background: var(--card);
      overflow: hidden;
      transition: border-color 0.12s, background 0.12s;
    }
    .promo-piece:hover { border-color: var(--accent); background: rgba(127,166,80,0.18); }
    .promo-piece img { width: 100%; height: 100%; display: block; }

    /* ── Game-over banner ────────────────────────────── */
    .gameover-banner {
      position: absolute;
      inset: 0;
      background: rgba(10,15,32,0.82);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      z-index: 60;
      border-radius: 8px;
    }
    .gameover-result {
      font-size: 30px;
      font-weight: 800;
      color: var(--text);
      text-align: center;
    }
    .gameover-result.win  { color: var(--accent); }
    .gameover-result.draw { color: var(--text2); }
    .gameover-btns { display: flex; gap: 12px; }
    .gameover-btn {
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(255,255,255,0.08);
      color: var(--text);
      font-family: inherit;
      transition: background 0.15s;
    }
    .gameover-btn-primary {
      background: rgba(127,166,80,0.2);
      border-color: rgba(127,166,80,0.45);
      color: #a0d070;
    }

    /* ── Eval bar ────────────────────────────────────── */
    .eval-bar-col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .eval-bar-track {
      width: 26px;
      height: 560px;
      background: #d8d8d8;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      border: 1px solid rgba(255,255,255,0.10);
    }
    .eval-bar-fill {
      background: #1e1e1e;
      width: 100%;
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      transition: height 0.4s cubic-bezier(0.4,0,0.2,1);
    }
    .eval-bar-text {
      font-size: 10px;
      font-weight: 700;
      color: var(--text2);
      font-family: monospace;
      white-space: nowrap;
    }

    /* ── Board column ────────────────────────────────── */
    .board-col {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .board-wrap {
      position: relative;
      width: 560px;
      height: 560px;
      flex-shrink: 0;
    }
    #practice-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .practice-status {
      font-size: 12px;
      color: var(--text2);
      text-align: center;
      min-height: 18px;
      font-weight: 500;
    }
    .practice-status.err { color: var(--danger); font-weight: 600; }
    .practice-status.ok  { color: var(--accent);  font-weight: 600; }

    /* ── Pill toggles ────────────────────────────────── */
    .practice-toggles {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .pill-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
      user-select: none;
    }
    .pill-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.55;
      flex-shrink: 0;
    }
    .pill-toggle.active {
      border-color: var(--accent);
      background: rgba(127,166,80,0.12);
      color: var(--accent);
    }
    .pill-toggle:not(.active):hover {
      border-color: rgba(255,255,255,0.18);
      color: var(--text);
    }

    /* ── Action buttons ──────────────────────────────── */
    .practice-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .prac-btn {
      padding: 7px 15px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .prac-btn:hover {
      border-color: rgba(255,255,255,0.2);
      color: var(--text);
      background: #1a3a60;
    }
    .prac-btn.setpos-on {
      border-color: var(--accent2);
      background: rgba(77,168,218,0.12);
      color: var(--accent2);
    }

    /* ── Move history panel ──────────────────────────── */
    .practice-history {
      flex: 1;
      min-width: 180px;
      max-width: 220px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      height: 560px;
    }
    .history-head {
      padding: 9px 12px;
      border-bottom: 1px solid var(--border);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text2);
      flex-shrink: 0;
    }
    .history-scroll {
      flex: 1;
      overflow-y: auto;
      padding: 5px 6px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
    }
    .history-pair {
      display: flex;
      align-items: baseline;
      padding: 1px 0;
    }
    .history-num {
      color: var(--text2);
      font-size: 11px;
      min-width: 24px;
      flex-shrink: 0;
    }
    .history-san {
      flex: 1;
      padding: 1px 4px;
      border-radius: 3px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0;
    }
    .history-empty {
      color: var(--text2);
      font-size: 12px;
      font-family: inherit;
      padding: 14px 10px;
      text-align: center;
      opacity: 0.65;
    }
    .history-eval-box {
      border-top: 1px solid var(--border);
      padding: 8px 12px;
      font-size: 12px;
      flex-shrink: 0;
      min-height: 44px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .heval-val {
      font-weight: 700;
      color: var(--text);
      font-family: monospace;
    }
    .heval-bm {
      font-size: 11px;
      color: var(--accent);
      font-family: monospace;
    }
  </style>
</head>

<div id="az-toast" class="az-toast"></div>

<div class="practice-container">

  <!-- Header -->
  <div class="practice-header">
    <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu">☰</button>
    <div class="practice-header-center">
      <span class="practice-header-icon">♜</span>
      <span class="practice-title">Practice Board</span>
    </div>
    <div class="practice-header-spacer"></div>
  </div>

  <!-- Piece palette (shown only in Set Position mode) -->
  <div class="palette-wrap hidden" id="palette-wrap">
    <span class="palette-label">White</span>
    <div class="palette-pieces" id="pal-white"></div>
    <div class="pal-sep"></div>
    <span class="palette-label">Black</span>
    <div class="palette-pieces" id="pal-black"></div>
    <div class="pal-sep"></div>
    <div class="pal-eraser-btn" id="pal-eraser" title="Erase piece">✕</div>
    <button class="pal-done-btn" id="pal-done">Done ✓</button>
  </div>

  <!-- Main content -->
  <div class="practice-main">

    <!-- Game-over banner -->
    <div class="gameover-banner hidden" id="gameover-banner">
      <div class="gameover-result" id="gameover-result"></div>
      <div class="gameover-btns">
        <button class="gameover-btn gameover-btn-primary" id="btn-play-again">↺ Play Again</button>
        <button class="gameover-btn" id="btn-new-pos">✏ New Position</button>
      </div>
    </div>

    <!-- Eval bar -->
    <div class="eval-bar-col" id="eval-bar-col">
      <div class="eval-bar-track">
        <div class="eval-bar-fill" id="eval-bar-fill"></div>
      </div>
      <div class="eval-bar-text" id="eval-bar-text">0.0</div>
    </div>

    <!-- Board + controls -->
    <div class="board-col">
      <div class="board-wrap">
        <canvas id="practice-canvas" width="560" height="560"></canvas>
        <!-- Promotion picker -->
        <div class="promo-overlay hidden" id="promo-overlay">
          <div class="promo-card">
            <div class="promo-label">Choose promotion piece</div>
            <div class="promo-options" id="promo-options"></div>
          </div>
        </div>
      </div>
      <div class="practice-status" id="practice-status"></div>
      <div class="practice-toggles">
        <button class="pill-toggle active" id="tog-bestmove">
          <span class="pill-dot"></span>Best Move
        </button>
        <button class="pill-toggle active" id="tog-evalbar">
          <span class="pill-dot"></span>Eval Bar
        </button>
      </div>
      <div class="practice-actions">
        <button class="prac-btn" id="btn-undo">↩ Undo</button>
        <button class="prac-btn" id="btn-reset">↺ Reset</button>
        <button class="prac-btn" id="btn-setpos">✏ Set Position</button>
      </div>
    </div>

    <!-- Move history -->
    <div class="practice-history">
      <div class="history-head">Move History</div>
      <div class="history-scroll" id="history-scroll">
        <div class="history-empty">No moves yet</div>
      </div>
      <div class="history-eval-box" id="history-eval-box"></div>
    </div>

  </div>
</div>

<script>document.addEventListener('DOMContentLoaded', function () { initNav('practice'); });</script>
<script>
/* ── Opening Explorer line preload ─────────────────────────────────── */
(function () {
  var raw = sessionStorage.getItem('csa_opening_line');
  if (!raw) return;
  var data;
  try { data = JSON.parse(raw); } catch (_) { return; }
  if (!data || !data.moves || !data.moves.length) return;

  /* Show dismissable banner (DOM is ready; scripts are at end of body) */
  var banner = document.createElement('div');
  banner.style.cssText = [
    'background:rgba(127,166,80,0.12)',
    'border:1px solid rgba(127,166,80,0.30)',
    'border-radius:6px',
    'padding:10px 16px',
    'display:flex',
    'align-items:center',
    'justify-content:space-between',
    'gap:12px',
    'font-size:13px',
    'margin-bottom:0'
  ].join(';');
  var nameStr = data.openingName || 'Opening Line';
  var moveStr = data.moves.slice(0, 8).join(' ') + (data.moves.length > 8 ? '…' : '');
  banner.innerHTML =
    '<span style="color:#a0d070;font-weight:600">📖 ' + nameStr + ': <span style="font-weight:400;font-family:\'Courier New\',monospace">' + moveStr + '</span></span>' +
    '<button onclick="this.parentElement.remove()" style="background:none;border:none;color:#a0d070;cursor:pointer;font-size:18px;line-height:1;padding:0 4px;font-family:inherit" aria-label="Dismiss">✕</button>';
  var header = document.querySelector('.practice-header');
  if (header) header.insertAdjacentElement('afterend', banner);

  /* Wrap Chess constructor so practice-board starts at the opening position */
  if (typeof window.Chess === 'undefined') return;
  var _Orig = window.Chess;
  window.Chess = function (fen) {
    if (fen !== undefined) return new _Orig(fen);   /* analysis calls pass FEN — leave alone */
    var inst = new _Orig();
    data.moves.forEach(function (m) { try { inst.move(m); } catch (_) {} });
    return inst;
  };
})();
</script>
<script>
  try {
    var _bl = localStorage.getItem('pf_board_light');
    var _bd = localStorage.getItem('pf_board_dark');
    if (_bl) window.BOARD_LIGHT = _bl;
    if (_bd) window.BOARD_DARK  = _bd;
  } catch (_) {}
</script>
