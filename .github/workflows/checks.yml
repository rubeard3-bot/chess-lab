# Runs on every pull request and every push to main.
# A red X on a pull request means: do not merge until it is fixed.
name: Chess Lab checks

on:
  pull_request:
    # labeled/unlabeled so adding the protected-change label re-runs the checks
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the PR rules can compare against main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: JavaScript syntax and hidden-class CSS rules (whole repo)
        run: python3 tests/ci_checks.py

      - name: Test suite (accuracy golden test, safety-lock tests)
        run: node tests/run-all.js

      # Protected files need Russell's protected-change label; agent PRs need a
      # complete task file. Runs main's copy of the rules when one exists, so a
      # pull request cannot weaken the rules that judge it.
      - name: PR rules (protected files and task file)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if git cat-file -e "$BASE_SHA:tests/pr_rules.js" 2>/dev/null; then
            git show "$BASE_SHA:tests/pr_rules.js" > "$RUNNER_TEMP/pr_rules.js"
            node "$RUNNER_TEMP/pr_rules.js"
          else
            node tests/pr_rules.js
          fi
