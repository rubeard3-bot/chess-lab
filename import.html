<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import from Chess.com — Chess Lab</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="import-page">

  <div id="import-toast" class="import-toast" role="status" aria-live="polite"></div>

  <!-- Nav Drawer Overlay -->
  <div id="nav-overlay" class="nav-overlay hidden"></div>

  <!-- Hamburger Nav Drawer -->
  <div id="nav-drawer" class="nav-drawer">
    <div class="nav-drawer-header">
      <span class="nav-drawer-brand">♟ Chess Lab</span>
      <button id="nav-drawer-close" class="nav-drawer-close" aria-label="Close menu">✕</button>
    </div>
    <nav class="nav-drawer-nav">
      <a href="index.html" class="nav-item"><span class="nav-item-icon">🏠</span><span>Home</span></a>
      <a href="analyzer.html" class="nav-item"><span class="nav-item-icon">♟</span><span>Game Analyzer</span></a>
      <a href="archive.html" class="nav-item"><span class="nav-item-icon">📂</span><span>Game Archive</span></a>
      <a href="practice.html" class="nav-item"><span class="nav-item-icon">♜</span><span>Practice Board</span></a>
      <button class="nav-item nav-item-btn" id="nav-progress-btn">
        <span class="nav-item-icon">📈</span><span>My Progress</span>
        <span class="nav-coming-soon">Soon</span>
      </button>
      <button class="nav-item nav-item-btn" id="nav-openings-btn">
        <span class="nav-item-icon">📖</span><span>Opening Explorer</span>
        <span class="nav-coming-soon">Soon</span>
      </button>
    </nav>
    <div class="nav-drawer-footer">
      <button class="nav-item nav-item-btn" id="change-api-key-link">
        <span class="nav-item-icon">⚙</span><span>Settings / API Key</span>
      </button>
    </div>
  </div>

  <div class="import-container">

    <!-- Header -->
    <header class="import-header">
      <button id="hamburger-btn" class="hamburger-btn" aria-label="Open menu">☰</button>
      <div class="import-header-center">
        <span class="import-header-logo">♟</span>
        <h1 class="import-header-title">Import from Chess.com</h1>
        <span id="import-username-display" class="import-connected-username" style="display:none"></span>
      </div>
      <div class="import-header-spacer"></div>
    </header>

    <!-- Not connected state -->
    <div id="import-no-connection" class="import-empty hidden">
      <div class="import-empty-icon">⚡</div>
      <p>No chess.com account connected.</p>
      <p><a href="index.html">Go to the home page</a> to connect your chess.com username first.</p>
    </div>

    <!-- Controls -->
    <div id="import-controls" class="import-controls hidden">

      <div class="import-control-group">
        <label class="import-label" for="import-month-select">Month</label>
        <select id="import-month-select" class="import-select">
          <option value="">Loading archives…</option>
        </select>
      </div>

      <div class="import-control-group">
        <span class="import-label">Time Control</span>
        <div class="filter-toggle-group" id="tc-filter">
          <button class="filter-btn active" data-tc="all">All</button>
          <button class="filter-btn" data-tc="bullet">Bullet</button>
          <button class="filter-btn" data-tc="blitz">Blitz</button>
          <button class="filter-btn" data-tc="rapid">Rapid</button>
          <button class="filter-btn" data-tc="classical">Classical</button>
        </div>
      </div>

      <div class="import-control-group">
        <span class="import-label">Result</span>
        <div class="filter-toggle-group" id="result-filter">
          <button class="filter-btn active" data-result="all">All</button>
          <button class="filter-btn" data-result="win">Wins</button>
          <button class="filter-btn" data-result="loss">Losses</button>
          <button class="filter-btn" data-result="draw">Draws</button>
        </div>
      </div>

      <button id="import-all-btn" class="import-all-btn">Import All This Month</button>

    </div>

    <!-- Loading spinner -->
    <div id="import-loading" class="import-loading hidden">
      <span class="spinner"></span> Loading games…
    </div>

    <!-- Mass Import Bar -->
    <div id="mass-import-bar" class="mass-import-bar hidden">
      <label class="mass-select-all-label" for="select-all-cb">
        <input type="checkbox" id="select-all-cb">
        Select All
      </label>
      <span id="mass-selected-count" class="mass-selected-count">0 games selected</span>
      <div class="mass-import-btns">
        <button id="import-last-5-btn" class="import-quick-btn">Import Last 5</button>
        <button id="import-last-10-btn" class="import-quick-btn">Import Last 10</button>
        <button id="import-selected-btn" class="import-selected-btn" disabled>Import &amp; Analyze Selected</button>
      </div>
    </div>

    <!-- Game list -->
    <div id="import-game-list" class="import-game-list"></div>

    <!-- Load more -->
    <div id="import-load-more-wrap" class="import-load-more-wrap hidden">
      <button id="import-load-more-btn" class="import-load-more-btn">Load More</button>
    </div>

    <!-- Empty state -->
    <div id="import-empty" class="import-empty hidden">
      <div class="import-empty-icon">♟</div>
      <p>No games found for the selected filters.</p>
    </div>

  </div>

  <script src="js/storage.js"></script>
  <script src="js/chesscom.js"></script>
  <script src="js/memory.js"></script>
  <script src="js/nav.js"></script>
  <script>document.addEventListener('DOMContentLoaded', function () { initNav('import'); });</script>
  <script>
    (function () {

      /* ---- constants ---- */
      const LS_USERNAME = 'csa_chesscom_username';
      const PAGE_SIZE   = 20;

      /* ---- state ---- */
      let username       = '';
      let allGames       = [];
      let filteredGames  = [];
      let visibleCount   = PAGE_SIZE;
      let tcFilter       = 'all';
      let resultFilter   = 'all';
      let analyzedHashes = new Set();
      let selectedHashes = new Set();

      /* ---- elements ---- */
      const elNoConn          = document.getElementById('import-no-connection');
      const elControls        = document.getElementById('import-controls');
      const elLoading         = document.getElementById('import-loading');
      const elGameList        = document.getElementById('import-game-list');
      const elLoadMore        = document.getElementById('import-load-more-wrap');
      const elEmpty           = document.getElementById('import-empty');
      const elMonthSel        = document.getElementById('import-month-select');
      const elUsername        = document.getElementById('import-username-display');
      const elMassBar         = document.getElementById('mass-import-bar');
      const elSelectedCount   = document.getElementById('mass-selected-count');
      const elImportSelBtn    = document.getElementById('import-selected-btn');
      const elSelectAllCb     = document.getElementById('select-all-cb');

      /* ---- toast ---- */
      const toast = document.getElementById('import-toast');
      let toastTimer;
      function showToast(msg) {
        clearTimeout(toastTimer);
        toast.textContent = msg;
        toast.classList.add('show');
        toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
      }

      /* ---- pgn hash (djb2) ---- */
      function pgnHash(pgn) {
        const clean = pgn.replace(/\s+/g, ' ').trim();
        let h = 5381;
        for (let i = 0; i < clean.length; i++) {
          h = (((h << 5) + h) + clean.charCodeAt(i)) & 0x7fffffff;
        }
        return h.toString(36);
      }

      function buildAnalyzedSet() {
        const games = Storage.loadAllGames();
        const set   = new Set();
        games.forEach(g => { if (g.pgn) set.add(pgnHash(g.pgn)); });
        return set;
      }

      /* ---- game helpers ---- */
      function getResult(game) {
        const lc = username.toLowerCase();
        const isWhite = game.white.username.toLowerCase() === lc;
        const myResult = isWhite ? game.white.result : game.black.result;
        if (myResult === 'win') return 'win';
        const lossResults = ['checkmated','timeout','resigned','lose','abandoned','timeout_vs_insufficient'];
        if (lossResults.includes(myResult)) return 'loss';
        return 'draw';
      }

      function getOpponent(game) {
        const lc = username.toLowerCase();
        if (game.white.username.toLowerCase() === lc) {
          return { username: game.black.username, rating: game.black.rating };
        }
        return { username: game.white.username, rating: game.white.rating };
      }

      function getPlayerColor(game) {
        return game.white.username.toLowerCase() === username.toLowerCase() ? 'white' : 'black';
      }

      function extractOpening(pgn) {
        const m = pgn.match(/\[Opening "([^"]+)"\]/);
        return m ? m[1] : null;
      }

      function tcLabel(tc) {
        const map = { bullet: 'Bullet', blitz: 'Blitz', rapid: 'Rapid', classical: 'Classical', daily: 'Daily' };
        return map[tc] || tc || '?';
      }

      function formatDate(ts) {
        return new Date(ts * 1000).toLocaleDateString('en-US',
          { month: 'short', day: 'numeric', year: 'numeric' });
      }

      function archiveToLabel(url) {
        const parts = url.split('/');
        const year  = parts[parts.length - 2];
        const month = parseInt(parts[parts.length - 1], 10);
        const names = ['January','February','March','April','May','June',
                       'July','August','September','October','November','December'];
        return names[month - 1] + ' ' + year;
      }

      function archiveToYearMonth(url) {
        const parts = url.split('/');
        return { year: parts[parts.length - 2], month: parts[parts.length - 1] };
      }

      /* ---- selection ---- */
      function toggleSelection(hash) {
        if (selectedHashes.has(hash)) {
          selectedHashes.delete(hash);
        } else {
          selectedHashes.add(hash);
        }
        const isNowSelected = selectedHashes.has(hash);
        elGameList.querySelectorAll('.import-card').forEach(card => {
          const cb = card.querySelector('.import-card-cb');
          if (cb && cb.dataset.hash === hash) {
            card.classList.toggle('import-card-selected', isNowSelected);
            cb.checked = isNowSelected;
          }
        });
        updateSelectionUI();
      }

      function updateSelectionUI() {
        const count = selectedHashes.size;
        elSelectedCount.textContent = count === 1 ? '1 game selected' : `${count} games selected`;
        elImportSelBtn.disabled = count === 0;

        const visibleSlice = filteredGames.slice(0, visibleCount);
        const visibleSelected = visibleSlice.filter(g => selectedHashes.has(pgnHash(g.pgn || '')));
        if (visibleSelected.length === 0) {
          elSelectAllCb.checked       = false;
          elSelectAllCb.indeterminate = false;
        } else if (visibleSelected.length === visibleSlice.length) {
          elSelectAllCb.checked       = true;
          elSelectAllCb.indeterminate = false;
        } else {
          elSelectAllCb.checked       = false;
          elSelectAllCb.indeterminate = true;
        }
      }

      /* ---- mass import launch ---- */
      function startMassImport(gameObjects) {
        if (gameObjects.length === 0) { showToast('No games to import.'); return; }
        const queue = gameObjects.map(g => ({ pgn: g.pgn || '', color: getPlayerColor(g) }));
        sessionStorage.setItem('csa_import_queue', JSON.stringify(queue));
        sessionStorage.setItem('csa_import_index', '0');
        window.location.href = 'analyzer.html';
      }

      function startQuickImport(n) {
        if (filteredGames.length === 0) { showToast('No games loaded yet.'); return; }
        startMassImport(filteredGames.slice(0, n));
      }

      /* ---- filter & render ---- */
      function applyFilters() {
        selectedHashes.clear();
        filteredGames = allGames.filter(g => {
          if (tcFilter !== 'all' && g.time_class !== tcFilter) return false;
          if (resultFilter !== 'all' && getResult(g) !== resultFilter) return false;
          return true;
        });
        visibleCount = PAGE_SIZE;
        renderGames();
      }

      function renderGames() {
        elGameList.innerHTML = '';
        elEmpty.classList.add('hidden');
        elLoadMore.classList.add('hidden');

        if (filteredGames.length === 0) {
          elEmpty.classList.remove('hidden');
          elMassBar.classList.add('hidden');
          return;
        }

        elMassBar.classList.remove('hidden');

        const slice = filteredGames.slice(0, visibleCount);
        const frag  = document.createDocumentFragment();
        const resultLabels = { win: 'Win', loss: 'Loss', draw: 'Draw' };

        slice.forEach(game => {
          const result   = getResult(game);
          const opponent = getOpponent(game);
          const opening  = extractOpening(game.pgn || '');
          const date     = game.end_time ? formatDate(game.end_time) : '';
          const color    = getPlayerColor(game);
          const hash     = pgnHash(game.pgn || '');
          const analyzed = analyzedHashes.has(hash);
          const isSelected = selectedHashes.has(hash);

          const card = document.createElement('div');
          card.className = `import-card import-card-${result}${isSelected ? ' import-card-selected' : ''}`;

          card.innerHTML = `
            <input type="checkbox" class="import-card-cb" data-hash="${hash}"${isSelected ? ' checked' : ''}>
            <span class="import-result-badge badge-${result}">${resultLabels[result]}</span>
            <div class="import-card-main">
              <div class="import-card-opponent">
                vs <strong>${escHtml(opponent.username)}</strong>
                ${opponent.rating ? `<span class="import-opp-rating">(${opponent.rating})</span>` : ''}
              </div>
              <div class="import-card-meta">
                <span class="import-tc-badge">${escHtml(tcLabel(game.time_class))}</span>
                ${date ? `<span class="import-card-date">${escHtml(date)}</span>` : ''}
                ${opening ? `<span class="import-card-opening">${escHtml(opening)}</span>` : ''}
              </div>
            </div>
            <div class="import-card-actions">
              ${analyzed ? '<span class="import-analyzed-badge">Already Analyzed</span>' : ''}
              <button class="import-analyze-btn">Analyze</button>
            </div>
          `;

          card.querySelector('.import-card-cb').addEventListener('click', e => {
            e.stopPropagation();
            toggleSelection(hash);
          });

          card.querySelector('.import-analyze-btn').addEventListener('click', e => {
            e.stopPropagation();
            sessionStorage.setItem('pending_pgn', game.pgn || '');
            sessionStorage.setItem('pending_color', color);
            window.location.href = 'analyzer.html';
          });

          card.addEventListener('click', () => toggleSelection(hash));

          frag.appendChild(card);
        });

        elGameList.appendChild(frag);

        if (visibleCount < filteredGames.length) {
          elLoadMore.classList.remove('hidden');
        }

        updateSelectionUI();
      }

      function escHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ---- month load ---- */
      async function loadMonth(url) {
        elLoading.classList.remove('hidden');
        elGameList.innerHTML = '';
        elEmpty.classList.add('hidden');
        elLoadMore.classList.add('hidden');
        elMassBar.classList.add('hidden');
        selectedHashes.clear();

        const { year, month } = archiveToYearMonth(url);
        const games = await ChessCom.fetchRecentGames(username, year, month);

        elLoading.classList.add('hidden');

        if (!games) {
          elEmpty.classList.remove('hidden');
          return;
        }

        allGames = games;
        applyFilters();
      }

      /* ---- init ---- */
      async function init() {
        username = localStorage.getItem(LS_USERNAME) || '';

        if (!username) {
          elNoConn.classList.remove('hidden');
          return;
        }

        elUsername.textContent = '@' + username;
        elUsername.style.display = '';
        elControls.classList.remove('hidden');

        analyzedHashes = buildAnalyzedSet();

        // Load archives
        const archives = await ChessCom.fetchGameArchives(username);
        elMonthSel.innerHTML = '';

        if (!archives || archives.length === 0) {
          const opt = document.createElement('option');
          opt.textContent = 'No games found';
          elMonthSel.appendChild(opt);
          return;
        }

        archives.forEach((url, i) => {
          const opt = document.createElement('option');
          opt.value       = url;
          opt.textContent = archiveToLabel(url);
          if (i === 0) opt.selected = true;
          elMonthSel.appendChild(opt);
        });

        await loadMonth(archives[0]);
      }

      /* ---- event listeners ---- */
      elMonthSel.addEventListener('change', () => {
        if (elMonthSel.value) loadMonth(elMonthSel.value);
      });

      document.getElementById('tc-filter').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('#tc-filter .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        tcFilter = btn.dataset.tc;
        applyFilters();
      });

      document.getElementById('result-filter').addEventListener('click', e => {
        const btn = e.target.closest('.filter-btn');
        if (!btn) return;
        document.querySelectorAll('#result-filter .filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        resultFilter = btn.dataset.result;
        applyFilters();
      });

      document.getElementById('import-all-btn').addEventListener('click', () => {
        showToast('Import All coming soon!');
      });

      document.getElementById('import-load-more-btn').addEventListener('click', () => {
        visibleCount += PAGE_SIZE;
        renderGames();
      });

      elSelectAllCb.addEventListener('change', e => {
        const visibleSlice = filteredGames.slice(0, visibleCount);
        if (e.target.checked) {
          visibleSlice.forEach(g => selectedHashes.add(pgnHash(g.pgn || '')));
        } else {
          visibleSlice.forEach(g => selectedHashes.delete(pgnHash(g.pgn || '')));
        }
        renderGames();
      });

      elImportSelBtn.addEventListener('click', () => {
        const selected = filteredGames
          .slice(0, visibleCount)
          .filter(g => selectedHashes.has(pgnHash(g.pgn || '')));
        startMassImport(selected);
      });

      document.getElementById('import-last-5-btn').addEventListener('click',  () => startQuickImport(5));
      document.getElementById('import-last-10-btn').addEventListener('click', () => startQuickImport(10));

      init();

    })();
  </script>
</body>
</html>
